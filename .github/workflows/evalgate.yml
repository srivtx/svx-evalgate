# Dogfood: SVX EvalGate gates its own demo eval suite.
# On pull requests the demo runs against the committed baseline
# (examples/llm-app/.svx/baseline.json); on main the baseline refreshes.
name: evalgate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'SVX EvalGate'
        uses: ./
        with:
          # config resolves against working-directory
          config: svx.evalgate.yaml
          working-directory: examples/llm-app
          update-baseline: ${{ github.ref == 'refs/heads/main' }}

      - name: 'Upload report artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evalgate-report
          path: examples/llm-app/.svx/
          if-no-files-found: ignore
