[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svx-evalgate"
version = "2.0.0"
description = "SVX EvalGate - deterministic statistics gate for AI evals in CI: pass@k, bootstrap confidence intervals, latency and cost statistics, regression bands against stored baselines, and a self-contained HTML report. Green or red on your pull request."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SVX Research" }]
keywords = [
    "llm", "evals", "evaluation", "ci", "continuous-integration",
    "pass-at-k", "regression-testing", "ai", "testing", "github-action",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/srivtx/svx-evalgate"
Research = "https://github.com/srivtx/svx-research"
Issues = "https://github.com/srivtx/svx-evalgate/issues"
Changelog = "https://github.com/srivtx/svx-evalgate/blob/main/CHANGELOG.md"

[project.scripts]
evalgate = "evalgate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["evalgate*"]

[tool.setuptools.package-data]
evalgate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "PIE", "FURB", "PLW"]
ignore = [
  "PLW1510",  # subprocess.run without check: returncodes handled explicitly
  "ISC004",    # unparenthesized implicit concat: deliberate style for long text
]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["evalgate"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
